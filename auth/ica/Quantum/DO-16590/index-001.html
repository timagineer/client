<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Client intake workflow [DO-16590]</title>
  <style>
    :root {
      --primary-25: oklch(38.052% 0.0888 258.539);
      --primary-30: oklch(43.332% 0.10422 258.384);
      --primary-50: oklch(49.153% 0.12057 258.167);
      --secondary-60: oklch(0.7169 0.2209 128.71);
      --neutral-20: oklch(0.3008 0.0116 234.63);
      --neutral-25: oklch(0.3608 0.0139 234.51);
      --neutral-30: oklch(0.4089 0.0157 234.40);
      --neutral-40: oklch(0.5192 0.0178 234.18);
      --neutral-45: oklch(0.563 0.018 234.07);
      --neutral-50: oklch(0.6068 0.0178 233.96);
      --neutral-55: oklch(0.653 0.017 233.85);
      --neutral-60: oklch(0.6996 0.0160 233.74);
      --neutral-70: oklch(0.7974 0.0127 233.51);
      --neutral-75: oklch(0.8373 0.0106 233.40);
      --neutral-80: oklch(0.8845 0.0083 233.29);
      --neutral-85: oklch(0.9234 0.0059 233.18);
      --neutral-90: oklch(0.9542 0.0034 233.07);
      --neutral-95: oklch(0.9772 0.0008 232.96);
      --primary-20: oklch(33.5% 0.077 258.7);
      --neutral-15: oklch(0.245 0.009 234.74);
      --border-btn: var(--neutral-70);
      --border-light: var(--neutral-75);
      --rad: 6px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--neutral-20);
      background: oklch(0.965 0.006 234);
    }

    /* ── App shell ── */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-2) var(--sp-4);
      background: #fff;
      border-bottom: 1px solid var(--border-light);
      height: 48px;
      flex-shrink: 0;
    }

    .shell-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .shell-sidebar {
      width: 80px;
      background: #fff;
      border-right: 1px solid var(--border-light);
      padding: var(--sp-3) var(--sp-2);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      flex-shrink: 0;
    }

    .shell-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      gap: 2px;
      padding: var(--sp-2) var(--sp-4) 0;
      background: oklch(0.965 0.006 234);
      border-bottom: 1px solid var(--border-light);
    }

    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-x: auto;
      overflow-y: auto;
      padding: 18px;
    }

    /* ── Wire elements ── */
    .wire-logo {
      display: flex;
      gap: 2px;
    }

    .wire-logo-mark {
      width: 32px;
      height: 18px;
      background: var(--primary-50);
      border-radius: var(--rad);
    }

    .wire-logo-text {
      width: 48px;
      height: 18px;
      background: var(--secondary-60);
      border-radius: var(--rad);
    }

    .wire-search {
      width: 320px;
      height: 28px;
      background: var(--neutral-90);
      border-radius: var(--rad);
    }

    .wire-header-right {
      display: flex;
      gap: var(--sp-3);
      align-items: center;
    }

    .wire-icon {
      width: 24px;
      height: 24px;
      background: var(--neutral-80);
      border-radius: var(--rad);
    }

    .wire-avatar {
      width: 26px;
      height: 26px;
      background: var(--neutral-80);
      border-radius: 50%;
    }

    .wire-nav-item {
      width: 100%;
      height: 56px;
      background: var(--neutral-85);
      border-radius: var(--rad);
      flex-shrink: 0;
    }

    .wire-nav-item.active {
      background: var(--neutral-75);
    }

    .sidebar-spacer {
      flex: 1;
    }

    .wire-tab {
      height: 32px;
      padding: 0 16px;
      background: var(--neutral-85);
      border-radius: var(--rad) var(--rad) 0 0;
      display: flex;
      align-items: center;
    }

    .wire-tab .wire-text {
      height: 10px;
      background: var(--neutral-70);
      border-radius: 2px;
    }

    .wire-tab.active {
      background: #fff;
      position: relative;
      z-index: 1;
      margin-bottom: -1px;
      border: 1px solid var(--border-light);
      border-bottom: none;
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--neutral-20);
      box-shadow: 0 1px 0 0 #fff;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wire-block {
      flex: 1;
      background: var(--neutral-90);
      border-radius: var(--rad);
    }

    /* ── Tooltip ── */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      background: var(--neutral-25);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 120ms, visibility 120ms;
      pointer-events: none;
      z-index: 100;
    }

    [data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
    }

    /* ── Wire table / toolbar ── */
    .wire-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    .wire-toolbar-left {
      display: flex;
      gap: var(--sp-2);
      align-items: center;
    }

    .wire-select {
      height: 28px;
      border-radius: 4px;
      background: var(--neutral-90);
    }

    .wire-search-bar {
      width: 220px;
      height: 28px;
      border-radius: 4px;
      background: var(--neutral-90);
    }

    .wire-table {
      width: 100%;
      border-collapse: collapse;
    }

    .wire-table thead tr {
      border-bottom: 2px solid var(--neutral-80);
    }

    .wire-table th {
      padding: 10px 8px;
      text-align: left;
    }

    .wire-table td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--neutral-85);
    }

    .wire-cell {
      height: 12px;
      border-radius: 3px;
      background: var(--neutral-85);
    }

    .wire-cell-dark {
      height: 12px;
      border-radius: 3px;
      background: var(--neutral-80);
    }

    .wire-pill {
      height: 20px;
      border-radius: 10px;
      background: var(--neutral-85);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: inherit;
      font-size: 13px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border-btn);
      border-radius: 4px;
      background: #fff;
      color: var(--neutral-45);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    .btn:hover {
      background: var(--neutral-95);
      border-color: var(--neutral-55);
      color: var(--neutral-15);
    }

    .btn-outline {
      background: #fff;
      border-color: var(--border-btn);
      color: var(--neutral-20);
      box-shadow: rgba(12, 12, 12, 0.09) 0px 1px 3px 0px;
    }

    .btn-outline:hover {
      background: var(--neutral-95);
      border-color: var(--neutral-55);
    }

    .btn-icon {
      padding: 0;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: var(--primary-50);
      border-color: var(--primary-50);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-30);
      border-color: var(--primary-30);
      color: #fff;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      color: var(--neutral-20);
    }

    .btn-ghost:hover {
      background: var(--neutral-90);
      border-color: transparent;
    }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 200ms cubic-bezier(.165, .84, .44, 1), visibility 200ms;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 540px;
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 48px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.97) translateY(8px);
      transition: opacity 180ms cubic-bezier(.165, .84, .44, 1), transform 220ms cubic-bezier(.165, .84, .44, 1), visibility 180ms;
    }

    .modal-backdrop.open .modal {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {

      .modal-backdrop,
      .modal {
        transition: none;
      }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--neutral-85);
    }

    .modal-header-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: hsl(218, 60%, 45%);
      margin: 0;
    }

    .modal-subtitle {
      font-size: 12px;
      font-weight: 400;
      color: var(--neutral-50);
      margin: 0;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neutral-40);
      padding: 0;
      flex-shrink: 0;
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
    }

    .modal-close:hover {
      background: var(--neutral-90);
      color: var(--neutral-20);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .modal-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--neutral-85);
    }

    .modal-footer-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }

    /* ── Wire placeholder in modal body ── */
    .wire-field {
      height: 56px;
      background: var(--neutral-90);
      border-radius: var(--rad);
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      align-items: center;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--rad);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      max-width: 320px;
      pointer-events: auto;
      animation: toastIn 300ms cubic-bezier(0.33, 1, 0.68, 1) both;
    }

    .toast.leaving {
      animation: toastOut 180ms cubic-bezier(0.33, 1, 0.68, 1) both;
    }

    .toast.success {
      background: hsl(140, 65%, 15%);
      color: hsl(140, 60%, 94%);
    }

    .toast.success svg {
      color: hsl(140, 65%, 55%);
    }

    .toast.error {
      background: hsl(352, 92%, 18%);
      color: hsl(11, 100%, 97%);
    }

    .toast.error svg {
      color: hsl(352, 92%, 62%);
    }

    .toast svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(8px);
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <!-- Header (wire) -->

      <div class="wire-logo">

      <div class="wire-search"></div>
      <div class="wire-header-right">
        <button class="btn btn-outline btn-icon" onclick="openModal()" data-tooltip="Create chart" aria-label="Create chart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />

        </button>
        <div class="wire-icon"></div>

        <div class="wire-icon"></div>

      </div>
    </header>

    <div class="shell-body">

      <!-- Sidebar (wire) -->
      <nav class="shell-sidebar">
        <div class="wire-nav-item active"></div>
        <div class="wire-nav-item"></div>
        <div class="wire-nav-item"></div>
        <div class="wire-nav-item"></div>
        <div class="wire-nav-item"></div>
        <div class="wire-nav-item"></div>
        <div class="sidebar-spacer"></div>

      <!-- Main -->
      <main class="shell-main">

        <div class="tab-bar">

        <!-- Page content (wire) -->
        <div class="page-content">

          <div class="wire-toolbar">

          <!-- Table -->
          <table class="wire-table">

            <tbody>
              <!-- Row 1 -->

                <td>

                <td>
                  <div class="wire-cell" style="width:80%;"></div>
                </td>
                <td>
                  <div class="wire-pill" style="width:70px;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:70%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:50%;"></div>
                </td>
              </tr>
              <!-- Row 2 -->
              <tr>
                <td>
                  <div class="wire-cell" style="width:60%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:55%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:75%;"></div>
                </td>
                <td>
                  <div class="wire-pill" style="width:80px;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:65%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:45%;"></div>
                </td>
              </tr>
              <!-- Row 3 -->
              <tr>
                <td>
                  <div class="wire-cell" style="width:80%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:70%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:60%;"></div>
                </td>
                <td>
                  <div class="wire-pill" style="width:60px;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:75%;"></div>
                </td>
                <td>
                  <div class="wire-cell" style="width:55%;"></div>

              </tr>
              <!-- Row 4 -->
              <tr>
                <td>
                  <div class="wire-cell" style="width:55%;"></div>

                <td>

                  <div class="wire-cell" style="width:85%;"></div>

                <td>

                </td>
                <td>

                <td>
                  <div class="wire-cell" style="width:40%;"></div>

              </tr>
              <!-- Row 5 -->
              <tr>
                <td>
                  <div class="wire-cell" style="width:70%;"></div>

        </div>

      </main>
    </div>
  </div>

  <!-- New Chart Modal -->
  <div class="modal-backdrop" id="newChartModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-text">
          <h2 class="modal-title">New chart</h2>
        </div>
        <button class="modal-close" onclick="closeModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- Fields TBD — pending requirements -->
        <div class="wire-field"></div>
        <div class="wire-field"></div>
        <div class="wire-field"></div>
        <div class="wire-field"></div>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary">Create chart</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script>
    function openModal() {
      document.getElementById('newChartModal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('newChartModal').classList.remove('open');
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>

</body>
