<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Documents share to sign [CLN-4229]</title>
  <style>
    /* ── Tokens (source: CLIN-3386) ── */
    :root {
      --primary-20: oklch(33.5% 0.077 258.7);
      --primary-25: oklch(38.052% 0.0888 258.539);
      --primary-30: oklch(43.332% 0.10422 258.384);
      --primary-50: oklch(49.153% 0.12057 258.167);
      --secondary-60: oklch(0.7169 0.2209 128.71);
      --neutral-05: oklch(0.1698 0.0008 234.96);
      --neutral-10: oklch(0.2044 0.0073 234.85);
      --neutral-15: oklch(0.2484 0.0122 234.74);
      --neutral-20: oklch(0.3008 0.0163 234.63);
      --neutral-25: oklch(0.3608 0.0197 234.51);
      --neutral-30: oklch(0.4089 0.0222 234.40);
      --neutral-35: oklch(0.4649 0.0241 234.29);
      --neutral-40: oklch(0.5192 0.0251 234.18);
      --neutral-45: oklch(0.5634 0.0255 234.07);
      --neutral-50: oklch(0.6068 0.0252 233.96);
      --neutral-55: oklch(0.6494 0.0242 233.85);
      --neutral-60: oklch(0.6996 0.0226 233.74);
      --neutral-65: oklch(0.7489 0.0205 233.63);
      --neutral-70: oklch(0.7974 0.0179 233.51);
      --neutral-75: oklch(0.8373 0.0149 233.40);
      --neutral-80: oklch(0.8845 0.0116 233.29);
      --neutral-85: oklch(0.9234 0.0081 233.18);
      --neutral-90: oklch(0.9542 0.0045 233.07);
      --neutral-95: oklch(0.9772 0.0008 232.96);
      --white: oklch(100% 0.00011 271.152);

      --border-btn: var(--neutral-70);
      --border-light: var(--neutral-75);

      --rad: 6px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--neutral-20);
      background: oklch(0.965 0.006 234);
    }

    /* ── App shell (CLIN-3386) ── */
    .app-shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 48px 1fr;
      overflow: hidden;
    }

    /* ── Wire header ── */
    .shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-2) var(--sp-4);
      background: #fff;
      border-bottom: 1px solid var(--border-light);
      height: 48px;
      flex-shrink: 0;
    }

    .wire-logo {
      display: flex;
      gap: 2px;
    }

    .wire-logo-mark {
      width: 32px;
      height: 18px;
      background: var(--primary-50);
      border-radius: var(--rad);
    }

    .wire-logo-text {
      width: 48px;
      height: 18px;
      background: var(--secondary-60);
      border-radius: var(--rad);
    }

    .wire-search {
      width: 320px;
      height: 28px;
      background: var(--neutral-90);
      border-radius: var(--rad);
    }

    .wire-header-right {
      display: flex;
      gap: var(--sp-3);
      align-items: center;
    }

    .wire-icon {
      width: 24px;
      height: 24px;
      background: var(--neutral-80);
      border-radius: var(--rad);
    }

    .wire-avatar {
      width: 26px;
      height: 26px;
      background: var(--neutral-80);
      border-radius: 50%;
    }

    /* ── Body ── */
    .shell-body {
      display: grid;
      grid-template-columns: 80px 1fr;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar (CLIN-3386) ── */
    .shell-sidebar {
      width: 80px;
      background: #fff;
      border-right: 1px solid var(--border-light);
      padding: var(--sp-3) var(--sp-2);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      overflow: hidden;
    }

    .wire-nav-item {
      width: 100%;
      height: 56px;
      background: var(--neutral-85);
      border-radius: var(--rad);
      flex-shrink: 0;
    }

    .wire-nav-item.active {
      background: var(--neutral-75);
    }

    .sidebar-spacer {
      flex: 1;
    }

    /* ── Main ── */
    .shell-main {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 0;
      min-width: 0;
      background: #fff;
      overflow: hidden;
    }

    /* ── Context bar (DO-14563) ── */
    .context-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      background: oklch(0.965 0.006 234);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    .wire-patient-avatar {
      width: 38px;
      height: 38px;
      background: var(--neutral-85);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .patient-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: var(--sp-2);
      border-right: 1px solid var(--border-light);
    }

    .context-row {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .context-spacer {
      flex: 1;
    }

    .action-block {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .wire-chip {
      height: 22px;
      background: var(--neutral-85);
      border-radius: var(--rad);
    }

    .wire-chip-sm {
      height: 18px;
      background: var(--neutral-85);
      border-radius: var(--rad);
    }

    .wire-text {
      height: 10px;
      background: var(--neutral-80);
      border-radius: 2px;
    }

    /* ── Tab bar (CLIN-3386 style) ── */
    .tab-bar {
      display: flex;
      gap: 2px;
      padding: var(--sp-2) var(--sp-4) 0;
      background: oklch(0.965 0.006 234);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    .wire-tab {
      height: 32px;
      padding: 0 16px;
      background: var(--neutral-85);
      border-radius: var(--rad) var(--rad) 0 0;
      display: flex;
      align-items: center;
    }

    .wire-tab .wire-text {
      height: 10px;
      background: var(--neutral-70);
      border-radius: 2px;
    }

    .wire-tab.active {
      background: #fff;
      position: relative;
      z-index: 1;
      margin-bottom: -1px;
      border: 1px solid var(--border-light);
      border-bottom: none;
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--neutral-20);
      box-shadow: 0 1px 0 0 #fff;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Page content ── */
    .page-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: oklch(0.965 0.006 234);
    }

    /* ── Table toolbar ── */
    .table-toolbar {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      background: #fff;
      border-bottom: 1px solid var(--border-light);
    }

    .table-toolbar-spacer {
      flex: 1;
    }

    /* ── Data table (BT-3479) ── */
    .data-table-wrap {
      background: #fff;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px var(--sp-3);
      border-bottom: 1px solid var(--border-light);
      font-weight: 500;
      color: var(--neutral-40);
      position: sticky;
      top: 0;
      z-index: 200;
      white-space: nowrap;
      background: #fff;
    }

    .data-table td {
      padding: 10px var(--sp-3);
      border-bottom: 1px solid var(--neutral-90);
      color: var(--neutral-30);
    }

    .data-table>tbody>tr:hover>td {
      background: var(--neutral-95);
    }

    .data-table>tbody>tr:hover .wire-text {
      background: var(--neutral-80);
    }

    .col-checkbox {
      width: 40px;
    }

    th.col-checkbox {
      overflow: visible;
    }

    .wire-checkbox {
      width: 16px;
      height: 16px;
      border: 1px solid var(--neutral-60);
      border-radius: 2px;
      background: var(--neutral-90);
    }

    .table-link {
      color: hsl(218, 45%, 45%);
      text-decoration: none;
    }

    .table-link:hover {
      text-decoration: underline;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.signed {
      background: hsl(209, 100%, 92%);
      color: hsl(209, 85%, 29%);
      border: 1px solid hsl(209, 70%, 65%);
    }

    .status-badge.finished {
      background: hsl(134, 41%, 88%);
      color: hsl(134, 55%, 21%);
      border: 1px solid hsl(134, 40%, 60%);
    }

    .status-badge.not-shared {
      background: hsl(46, 100%, 90%);
      color: hsl(40, 90%, 22%);
      border: 1px solid hsl(46, 70%, 70%);
    }

    .status-badge.shared {
      background: hsl(209, 100%, 92%);
      color: hsl(209, 85%, 29%);
      border: 1px solid hsl(209, 70%, 65%);
    }
  </style>
</head>
