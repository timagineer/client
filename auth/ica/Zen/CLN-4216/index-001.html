<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype: SMS settings [CLN-4216]</title>
  <style>
    :root {
      --paper: #fcfcfa;
      --ink: #1f2226;
      --muted: #666b73;
      --line: #9aa0a8;
      --faint: #e4e6e9;
      --active: #1f2226;
      --active-ink: #fcfcfa;
      --link: #1d4fbf;
      --redline: #b3206e;
      --redline-bg: #fbeaf3;
      --warn: #8a4b00;
      --warn-bg: #fff4dc;
      --info-bg: #eef3fb;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17191c;
        --ink: #e6e7e9;
        --muted: #9ba1a9;
        --line: #5d636b;
        --faint: #2a2d31;
        --active: #e6e7e9;
        --active-ink: #17191c;
        --link: #8fb1ff;
        --redline: #ff7fbf;
        --redline-bg: #3a1a2b;
        --warn: #ffc56b;
        --warn-bg: #332611;
        --info-bg: #1c2638;
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.55 "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px dashed var(--line);
    }

    .bar p {
      margin: 0;
      color: var(--muted);
    }

    .bar .ctrls {
      display: flex;
      gap: 8px;
    }

    .frame {
      max-width: 1120px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .heading {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .04em;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      background: none;
      border: 1px solid var(--line);
      border-bottom: none;
      margin-right: -1px;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab[aria-current="true"] {
      background: var(--active);
      color: var(--active-ink);
      border-color: var(--active);
    }

    .tab .new {
      color: var(--redline);
    }

    .tab[aria-current="true"] .new {
      color: inherit;
    }

    .shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      border: 1px solid var(--line);
      border-top: none;
      min-height: 560px;
    }

    .subnav {
      border-right: 1px solid var(--line);
      padding: 8px 0;
    }

    .sub {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 7px 14px;
      cursor: pointer;
    }

    .sub[aria-current="true"] {
      background: var(--active);
      color: var(--active-ink);
    }

    .sub[aria-current="true"]::before {
      content: "▌";
    }

    .sub .new {
      color: var(--redline);
    }

    .sub[aria-current="true"] .new {
      color: inherit;
    }

    main {
      padding: 20px 24px 32px;
      min-width: 0;
    }

    main h2 {
      font-size: 17px;
      margin: 0 0 4px;
      font-weight: 700;
    }

    main h3 {
      font-size: 14px;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .lede {
      color: var(--muted);
      margin: 0 0 16px;
      max-width: 64ch;
    }

    .rule {
      border: none;
      border-top: 1px dashed var(--line);
      margin: 20px 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .row.between {
      justify-content: space-between;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 0;
      max-width: 64ch;
    }

    .stack>*+* {
      margin-top: 10px;
    }

    .tg,
    .cb {
      background: none;
      border: none;
      padding: 2px 0;
      cursor: pointer;
      text-align: left;
    }

    .tg {
      font-weight: 700;
      white-space: pre;
    }

    .tg[aria-pressed="false"] {
      color: var(--muted);
    }

    .cb .box {
      font-weight: 700;
    }

    .tg:disabled,
    .cb:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .lnk {
      background: none;
      border: none;
      padding: 0;
      color: var(--link);
      text-decoration: underline;
      cursor: pointer;
    }

    .box-card {
      border: 1px solid var(--line);
      padding: 12px 14px;
    }

    .box-card+.box-card {
      margin-top: 12px;
    }

    .box-card.off {
      border-style: dashed;
    }

    .box-card.dim> :not(.card-head) {
      opacity: .45;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    input[type="time"],
    input[type="number"],
    select,
    textarea {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 4px 8px;
      border-radius: 0;
    }

    input[type="number"] {
      width: 6ch;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
    }

    input:disabled,
    select:disabled {
      opacity: .45;
    }

    .banner {
      border: 1px solid var(--line);
      padding: 10px 12px;
      margin-bottom: 16px;
      max-width: 72ch;
    }

    .banner.info {
      background: var(--info-bg);
    }

    .banner.warn {
      background: var(--warn-bg);
      border-color: var(--warn);
    }

    .banner.warn strong {
      color: var(--warn);
    }

    .err {
      color: var(--warn);
      font-size: 13px;
      margin: 6px 0 0;
    }

    .remtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }

    .remtab {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--line);
      border-bottom: none;
    }

    .remtab button {
      background: none;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }

    .remtab[aria-current="true"] {
      background: var(--active);
      color: var(--active-ink);
    }

    .remtab .x {
      border-left: 1px solid var(--line);
    }

    .add {
      background: none;
      border: 1px dashed var(--line);
      border-bottom: none;
      padding: 5px 10px;
      cursor: pointer;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .tagbtn {
      background: none;
      border: 1px solid var(--line);
      padding: 2px 6px;
      cursor: pointer;
    }

    .tagbtn.sys {
      border-style: dashed;
    }

    .preview {
      border: 1px dashed var(--line);
      padding: 10px 12px;
      margin-top: 8px;
      max-width: 72ch;
    }

    .preview .lbl {
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .applies {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .applies li {
      padding: 3px 0;
    }

    .applies .st {
      color: var(--muted);
    }

    .note {
      display: block;
      margin: 8px 0;
      padding: 6px 10px;
      max-width: 72ch;
      color: var(--redline);
      background: var(--redline-bg);
      border-left: 3px solid var(--redline);
      font-size: 13px;
    }

    body.no-notes .note {
      display: none;
    }

    .placeholder {
      color: var(--muted);
      border: 1px dashed var(--line);
      padding: 40px;
      text-align: center;
    }

    .ctl {
      background: none;
      border: 1px solid var(--line);
      padding: 4px 10px;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .subnav {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="bar">
    <p>Settings prototype. Changes apply instantly so you can follow them across sections.</p>
    <div class="ctrls">
      <button class="ctl" id="notesBtn" aria-pressed="true">Hide annotations</button>
      <button class="ctl" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="frame">
    <p class="heading">SETTINGS</p>
    <nav class="tabs" id="tabs" aria-label="Settings sections"></nav>
    <div class="shell">
      <nav class="subnav" id="subnav" aria-label="Sub-sections"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <script>
    const DEFAULT_TEXT = 'Hi {Client First Name}, reminder of your appt with {Provider Name} on {Day of the Week} {Appointment Date} at {Appointment Time}. {Reply Instructions}';

    function initialState() {
      return {
        view: { tab: 'calendar', sub: 'sms' },
        notes: true,
        migrationDismissed: false,
        sms: { master: true, start: '08:00', end: '17:00', appt: true, tele: true, teleIgnore: true, docs: false },
        confirm: { allowed: true },
        cancel: { allowed: true, hours: '24', late: 'This appointment can no longer be cancelled online. Please call {Practice Phone}.' },
        reminders: [
          { on: true, hours: 24, askConfirm: true, includeCancel: true, text: DEFAULT_TEXT },
          { on: true, hours: 2, askConfirm: false, includeCancel: false, text: 'See you soon, {Client First Name}: {Appointment Time} with {Provider Name} at {Location}. {Reply Instructions}' }
        ],
        activeRem: 0
      };
    }
    let S = initialState();

    const TABS = [
      { id: 'info', label: 'Practice Information' },
      {
        id: 'calendar', label: 'Calendar Settings', subs: [
          ['email-notif', 'Email Appt Notifications'],
          ['email-rem', 'Email Appt Reminders'],
          ['copay', 'Copayment Settings'],
          ['sms', 'SMS/Text Appt Reminders'],
          ['types', 'Appointment Types'],
          ['default', 'Default Calendar Setup'],
          ['avail', 'Availability Management'],
          ['booking', 'Allow Client Booking'],
          ['cancel', 'Confirmations & Cancellations', true]
        ]
      },
      { id: 'communications', label: 'Communications', isNew: true, subs: [['sms', 'SMS Settings', true]] },
      { id: 'portal', label: 'Client Portal' },
      { id: 'practice', label: 'Practice Settings' },
      { id: 'data', label: 'Data Requirements' },
      { id: 'rcm', label: 'Revenue Cycle Management' },
      { id: 'forms', label: 'Practice Forms' },
      { id: 'notes', label: 'Note Settings' },
      { id: 'accounts', label: 'Account Management' }
    ];

    const get = p => p.split('.').reduce((o, k) => o[k], S);
    const set = (p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function fmtTime(t) {
      const [h, m] = t.split(':').map(Number);
      const ap = h >= 12 ? 'PM' : 'AM';
      return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`;
    }
    function windowText() { return `${fmtTime(S.sms.start)} – ${fmtTime(S.sms.end)}`; }
    function cancelSummary() {
      if (!S.cancel.allowed) return "clients can't cancel appointments themselves";
      if (S.cancel.hours === 'any') return 'clients can cancel any time before the appointment';
      return `clients can cancel up to ${S.cancel.hours} hour${S.cancel.hours === '1' ? '' : 's'} before`;
    }
    function policySummary() {
      const c = S.confirm.allowed ? 'Clients can confirm' : "Clients can't confirm";
      const x = !S.cancel.allowed ? "can't cancel" : S.cancel.hours === 'any' ? 'can cancel any time before' : `can cancel up to ${S.cancel.hours} hour${S.cancel.hours === '1' ? '' : 's'} before`;
      return `${c}, and ${x}`;
    }
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

    /* ---------- primitives ---------- */
    function tg(path, label, disabled) {
      const v = get(path);
      return `<button class="tg" data-tg="${path}" aria-pressed="${v}" aria-label="${esc(label)}" ${disabled ? 'disabled' : ''}>${v ? '[━━●] ON ' : '[○━━] OFF'}</button>`;
    }
    function cb(path, label, disabled) {
      const v = get(path);
      return `<button class="cb" data-tg="${path}" role="checkbox" aria-checked="${v}" ${disabled ? 'disabled' : ''}><span class="box">${v ? '[✓]' : '[ ]'}</span> ${label}</button>`;
    }
    function radio(path, val, label) {
      const on = get(path) === val;
      return `<button class="cb" data-set="${path}" data-val="${val}" role="radio" aria-checked="${on}"><span class="box">${on ? '(●)' : '( )'}</span> ${label}</button>`;
    }
    const link = (go, label) => `<button class="lnk" data-go="${go}">${label}</button>`;
    const note = t => `<span class="note">${t}</span>`;

    /* ---------- reply instructions ---------- */
    function replyInstructions(r) {
      const c = S.confirm.allowed && r.askConfirm;
      const x = S.cancel.allowed && r.includeCancel;
      if (c && x) return 'Reply C to confirm or X to cancel.';
      if (c) return 'Reply C to confirm.';
      if (x) return 'Reply X to cancel.';
      return '';
    }
    const SAMPLE = {
      'Client First Name': 'Maya', 'Provider Name': 'Dr. Okafor', 'Location': 'Main office',
      'Appointment Date': 'Nov 3', 'Appointment Time': '2:00 PM', 'Day of the Week': 'Tuesday'
    };
    function renderPreview(r) {
      return r.text.replace(/\{([^}]+)\}/g, (m, k) => k === 'Reply Instructions' ? replyInstructions(r) : (SAMPLE[k] ?? m)).replace(/\s+$/, '');
    }
    function cancelTextWarning(r) {
      if (S.cancel.allowed) return '';
      if (/cancel/i.test(r.text.replace(/\{Reply Instructions\}/g, ''))) {
        return `<p class="err">This text mentions cancelling, but client cancellations are off. Remove it, or use {Reply Instructions}, which only shows options clients actually have.</p>`;
      }
      return '';
    }

    /* ---------- views ---------- */
    function viewSmsSettings() {
      const m = S.sms.master;
      const windowErr = S.sms.start >= S.sms.end ? `<p class="err">The send window must end after it starts.</p>` : '';
      const n = S.reminders.length;
      const card = (key, title, body, extraClass = '') => {
        const on = S.sms[key];
        return `<div class="box-card ${on && m ? '' : 'off'} ${m ? '' : 'dim'} ${extraClass}">
      <div class="card-head"><h3>${title}</h3>${tg('sms.' + key, title, !m)}</div>
      ${body(!m || !on)}
    </div>`;
      };
      return `
    <h2>SMS / text messaging</h2>
    <p class="lede">Turn client text messages on or off and set when they can be sent.</p>
    <div class="row between">
      <div><strong>Send text messages to clients</strong>
        <p class="hint">Master switch. When off, no client texts are sent. Choices below are kept for when you turn it back on.</p></div>
      ${tg('sms.master', 'Send text messages to clients')}
    </div>
    ${note('New page. One place to control client SMS, replacing on/off switches spread across features.')}

    <hr class="rule">
    <h3>Send window</h3>
    <div class="row">Only send texts between
      <input type="time" data-bind="sms.start" value="${S.sms.start}" ${m ? '' : 'disabled'} aria-label="Window start">
      and
      <input type="time" data-bind="sms.end" value="${S.sms.end}" ${m ? '' : 'disabled'} aria-label="Window end">
    </div>
    ${windowErr}
    <p class="hint">Applies to every message type unless a type below overrides it.</p>
    ${note('Moved here from each reminder template. Quiet hours are a practice rule, not a per-reminder setting.')}

    <hr class="rule">
    <h3>Message types</h3>
    ${card('appt', 'Appointment reminders', dis => `
      <div class="stack" style="margin-top:8px">
        <div class="hint">${policySummary()}. ${link('calendar/cancel', 'Change in Confirmations & Cancellations')}</div>
        <div class="hint">${n} reminder template${n === 1 ? '' : 's'} set lead times and message text. ${link('calendar/sms', 'Manage reminder templates')}</div>
      </div>
      ${note('Changed: confirm-by-text moved to Calendar › Confirmations & Cancellations, because email and the portal let clients confirm too. This card only reflects the policy.')}
    `)}
    ${card('tele', 'Telehealth', dis => `
      <div style="margin-top:8px">${cb('sms.teleIgnore', 'Send session links outside the send window', dis)}</div>
      <p class="hint">Session links are time-critical, so they can skip quiet hours.</p>
    `)}
    ${card('docs', 'Documents & forms', () => `
      <p class="hint">Text clients when documents, notes, or forms are shared with them or assigned for signature.</p>
    `)}
    ${note('Message types are a catch-all list: new client-facing features add a card here.')}
  `;
    }

    function reminderBanner(r) {
      if (!S.sms.master) return `<div class="banner warn"><strong>Texts won't send.</strong> Client SMS is off. ${link('communications/sms', 'Turn it on in Communications › SMS Settings')}</div>`;
      if (!S.sms.appt) return `<div class="banner warn"><strong>Texts won't send.</strong> SMS is off for appointment reminders. ${link('communications/sms', 'Turn it on in Communications › SMS Settings')}</div>`;
      return `<div class="banner info">SMS is on for appointment reminders. Texts send ${windowText()}. ${link('communications/sms', 'Manage in Communications › SMS Settings')}</div>`;
    }

    function viewReminders() {
      const i = Math.min(S.activeRem, S.reminders.length - 1);
      S.activeRem = i;
      const r = S.reminders[i];
      const base = `reminders.${i}`;
      const tabs = S.reminders.map((_, k) => `
    <div class="remtab" aria-current="${k === i}">
      <button data-rem="${k}">Reminder ${k + 1}</button>
      ${S.reminders.length > 1 ? `<button class="x" data-remdel="${k}" aria-label="Remove reminder ${k + 1}">✕</button>` : ''}
    </div>`).join('');
      const tags = ['Client First Name', 'Provider Name', 'Location', 'Appointment Date', 'Appointment Time', 'Day of the Week']
        .map(t => `<button class="tagbtn" data-tag="${t}">{${t}}</button>`).join('') +
        `<button class="tagbtn sys" data-tag="Reply Instructions">{Reply Instructions}</button>`;

      return `
    <div class="remtabs">${tabs}<button class="add" data-add="1">+ Add reminder</button></div>
    <h2>SMS / text appointment reminders</h2>
    <p class="lede">Each reminder sets when it goes out and what it says.</p>
    ${reminderBanner(r)}
    ${note('New status banner. Reflects Communications settings so nobody edits a template that will never send.')}

    <div class="row between">
      <strong>Send this reminder</strong>
      ${tg(base + '.on', 'Send this reminder')}
    </div>
    ${note('This switch now controls only this reminder. Turning SMS on or off for all reminders happens in Communications.')}

    <div class="row" style="margin-top:12px">Send
      <input type="number" min="1" data-bind="${base}.hours" value="${r.hours}" aria-label="Hours ahead">
      hours ahead of an appointment.
    </div>

    <hr class="rule">
    <h3>Client replies</h3>
    <div class="stack">
      <div>
        ${cb(base + '.askConfirm', 'Ask client to confirm in this reminder', !S.confirm.allowed)}
        <p class="hint">${S.confirm.allowed ? 'Clients can confirm appointments' : "Clients can't confirm appointments"}. ${link('calendar/cancel', 'Change in Confirmations & Cancellations')}</p>
      </div>
      <div>
        ${cb(base + '.includeCancel', 'Include cancel instructions in this reminder', !S.cancel.allowed)}
        <p class="hint">${cap(cancelSummary())}. ${link('calendar/cancel', 'Change in Confirmations & Cancellations')}</p>
      </div>
    </div>
    ${note('Changed: these only control what this reminder says. Removed from this page: the cancellation limit dropdown (now Confirmations & Cancellations) and the send window (now SMS Settings).')}

    <hr class="rule">
    <h3>Reminder text</h3>
    <p class="hint">Use tags to insert placeholders. {Reply Instructions} fills in only the reply options clients actually have.</p>
    <div class="tags">${tags}</div>
    <textarea id="remtext" data-live="${base}.text" aria-label="Reminder text">${esc(r.text)}</textarea>
    <div id="cancelWarn">${cancelTextWarning(r)}</div>
    <div class="preview"><span class="lbl">Preview</span><span id="preview">${esc(renderPreview(r))}</span></div>
    ${note('New: system tag {Reply Instructions} plus live preview. Prevents texts that offer cancelling when the practice has turned it off.')}
  `;
    }

    function viewCancel() {
      const a = S.cancel.allowed, c = S.confirm.allowed;
      const smsOff = !S.sms.master || !S.sms.appt ? ' <span class="st">(SMS reminders are currently off)</span>' : '';
      const channels = (on, verb) => `
    <ul class="applies">
      <li>${on ? '✓' : '✕'} Text message replies to reminders${smsOff}</li>
      <li>${on ? '✓' : '✕'} ${cap(verb)} links in email reminders and notices</li>
      <li>${on ? '✓' : '✕'} ${cap(verb)}ing in the client portal</li>
    </ul>`;
      const migration = S.migrationDismissed ? '' : `
    <div class="banner info">
      These settings moved here from your SMS reminder templates and now apply to email and the client portal too.
      Confirmations are on because at least one of your reminders allowed them. Cancellations are set to 24 hours, the strictest limit your reminders used.
      <div style="margin-top:6px"><button class="lnk" data-dismiss="1">Dismiss</button></div>
    </div>`;
      return `
    <h2>Confirmations & cancellations</h2>
    <p class="lede">Controls what clients can do with their appointments by text, email, and the client portal. Staff can always confirm or cancel from the calendar.</p>
    ${migration}
    ${note('New page. One practice-level policy replaces the confirm and cancel settings each SMS reminder used to set on its own.')}

    <hr class="rule">
    <h3>Allow clients to confirm appointments?</h3>
    <div class="row" role="radiogroup" aria-label="Allow clients to confirm">
      ${radio('confirm.allowed', true, 'Yes')}
      ${radio('confirm.allowed', false, 'No')}
    </div>
    <p class="hint">${c ? 'Clients can confirm via:' : "Clients can't confirm via:"}</p>
    ${channels(c, 'confirm')}
    ${note('Moved from SMS Settings and from each reminder template. No time cutoff: confirming late does no harm. Validate whether any practice needs one.')}

    <hr class="rule">
    <h3>Allow clients to cancel appointments?</h3>
    <div class="row" role="radiogroup" aria-label="Allow clients to cancel">
      ${radio('cancel.allowed', true, 'Yes')}
      ${radio('cancel.allowed', false, 'No')}
    </div>
    ${a ? `
      <h3 style="margin-top:16px">How close to the appointment can clients cancel?</h3>
      <select data-bind="cancel.hours" aria-label="Cancellation cutoff">
        ${[['any', 'Any time before'], ['1', 'Up to 1 hour before'], ['3', 'Up to 3 hours before'], ['24', 'Up to 24 hours before'], ['48', 'Up to 48 hours before'], ['72', 'Up to 72 hours before']]
            .map(([v, l]) => `<option value="${v}" ${S.cancel.hours === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>` : ''}
    <p class="hint">${a ? 'Clients can cancel via:' : "Clients can't cancel via:"}</p>
    ${channels(a, 'cancel')}
    ${note('Channel lists are informational, not toggles. Per-channel exceptions could be added later if practices need them.')}

    ${a ? `
      <hr class="rule">
      <h3>Message when a client tries to cancel too late</h3>
      <textarea data-live="cancel.late" aria-label="Late cancellation message">${esc(S.cancel.late)}</textarea>
      ${note('Proposed addition, not from the meeting. Cut if this release should stay minimal.')}` : ''}
  `;
    }

    function viewPlaceholder(label) {
      return `<div class="placeholder">${esc(label)} is unchanged in this prototype.</div>`;
    }

    /* ---------- render ---------- */
    function render() {
      document.body.classList.toggle('no-notes', !S.notes);
      const nb = document.getElementById('notesBtn');
      nb.textContent = S.notes ? 'Hide annotations' : 'Show annotations';
      nb.setAttribute('aria-pressed', S.notes);

      const tab = TABS.find(t => t.id === S.view.tab);
      document.getElementById('tabs').innerHTML = TABS.map(t =>
        `<button class="tab" data-tab="${t.id}" aria-current="${t.id === tab.id}">${t.label}${t.isNew ? ' <span class="new">(new)</span>' : ''}</button>`
      ).join('');

      const subs = tab.subs || [];
      document.getElementById('subnav').innerHTML = subs.length
        ? subs.map(([id, label, isNew]) => `<button class="sub" data-sub="${id}" aria-current="${id === S.view.sub}">${label}${isNew ? ' <span class="new">(new)</span>' : ''}</button>`).join('')
        : `<p class="hint" style="padding:7px 14px">No sub-sections in this prototype.</p>`;

      const main = document.getElementById('main');
      const key = `${S.view.tab}/${S.view.sub}`;
      if (key === 'communications/sms') main.innerHTML = viewSmsSettings();
      else if (key === 'calendar/sms') main.innerHTML = viewReminders();
      else if (key === 'calendar/cancel') main.innerHTML = viewCancel();
      else {
        const sub = subs.find(s => s[0] === S.view.sub);
        main.innerHTML = viewPlaceholder(sub ? sub[1] : tab.label);
      }
    }

    function go(tab, sub) {
      const t = TABS.find(x => x.id === tab);
      S.view = { tab, sub: sub || (t.subs ? (t.id === 'calendar' ? 'sms' : t.subs[0][0]) : 'none') };
      render();
      document.getElementById('main').focus();
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      const d = b.dataset;
      if (d.tg) { set(d.tg, !get(d.tg)); render(); }
      else if (d.set) { let v = d.val; if (v === 'true') v = true; else if (v === 'false') v = false; set(d.set, v); render(); }
      else if (d.go) { const [t, s] = d.go.split('/'); go(t, s); }
      else if (d.tab) { go(d.tab); }
      else if (d.sub) { S.view.sub = d.sub; render(); }
      else if (d.rem) { S.activeRem = +d.rem; render(); }
      else if (d.remdel) { S.reminders.splice(+d.remdel, 1); S.activeRem = Math.max(0, S.activeRem - (+d.remdel <= S.activeRem ? 1 : 0)); render(); }
      else if (d.add) { S.reminders.push({ on: true, hours: 48, askConfirm: true, includeCancel: true, text: DEFAULT_TEXT }); S.activeRem = S.reminders.length - 1; render(); }
      else if (d.dismiss) { S.migrationDismissed = true; render(); }
      else if (d.tag) {
        const ta = document.getElementById('remtext');
        const ins = `{${d.tag}}`;
        const st = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? ta.value.length;
        ta.value = ta.value.slice(0, st) + ins + ta.value.slice(en);
        set(ta.dataset.live, ta.value);
        ta.focus(); ta.selectionStart = ta.selectionEnd = st + ins.length;
        refreshPreview();
      }
    });

    document.addEventListener('change', e => {
      const el = e.target;
      if (!el.dataset.bind) return;
      let v = el.value;
      if (el.type === 'number') v = Math.max(1, parseInt(v, 10) || 1);
      set(el.dataset.bind, v);
      render();
    });

    document.addEventListener('input', e => {
      const el = e.target;
      if (!el.dataset.live) return;
      set(el.dataset.live, el.value);
      refreshPreview();
    });

    function refreshPreview() {
      const p = document.getElementById('preview');
      if (!p) return;
      const r = S.reminders[S.activeRem];
      p.textContent = renderPreview(r);
      document.getElementById('cancelWarn').innerHTML = cancelTextWarning(r);
    }

    document.getElementById('notesBtn').addEventListener('click', () => { S.notes = !S.notes; render(); });
    document.getElementById('resetBtn').addEventListener('click', () => { S = initialState(); render(); });

    render();
  </script>
</body>

</html>
