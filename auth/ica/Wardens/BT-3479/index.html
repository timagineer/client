<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BT-3479 · Custom Forms from Billing Worklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Azeret Mono', ui-monospace, monospace;
      --color-text: hsl(220, 20%, 20%);
      --color-text-muted: hsl(220, 12%, 43%);
      --color-link: hsl(212, 92%, 38%);
      --color-bg: hsl(220, 20%, 98%);
      --color-surface: hsl(0, 0%, 100%);
      --color-border: hsl(220, 15%, 90%);
      --color-hover: hsl(220, 30%, 96%);
      --radius: 5px;
    }

    body {
      font-family: var(--font-sans);
      font-size: 1rem;
      min-height: 100dvh;
      background: var(--color-bg);
      color: var(--color-text);
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.5rem;
    }

    .breadcrumb {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .breadcrumb a {
      color: var(--color-link);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb span {
      color: var(--color-text-muted);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .ticket-id {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--color-link);
    }

    .meta {
      font-size: 1rem;
      color: var(--color-text-muted);
    }

    .meta a {
      color: var(--color-link);
      text-decoration: none;
    }

    .meta a:hover {
      text-decoration: underline;
    }

    .versions {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .version {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
    }

    .version:last-child {
      border-bottom: none;
    }

    .version:hover {
      background: var(--color-hover);
    }

    .version:active {
      background: var(--color-border);
    }

    .version-name {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--color-link);
      white-space: nowrap;
    }

    .version-desc {
      flex: 1;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .version-date {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .version.current {
      background: var(--color-hover);
    }

    @media (min-width: 768px) {
      body {
        padding: 2rem 1.5rem;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: hsl(220, 15%, 85%);
        --color-text-muted: hsl(220, 10%, 63%);
        --color-link: hsl(212, 90%, 70%);
        --color-bg: hsl(220, 20%, 10%);
        --color-surface: hsl(220, 15%, 15%);
        --color-border: hsl(220, 15%, 25%);
        --color-hover: hsl(220, 20%, 20%);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <p class="breadcrumb"><a href="../../">← Prototypes</a><span> / Wardens</span></p>
      <h1><span class="ticket-id">BT-3479</span> Custom Forms from Billing Worklist</h1>
      <p class="meta"><a href="https://icanotes.atlassian.net/browse/BT-3479" target="_blank">View in Jira ↗</a></p>
    </header>
    <main class="versions">
      <div class="version current" data-href="index-002.html">
        <span class="version-name">v2</span>
        <span class="version-desc">As modal w/pagination and search <span style="color: hsl(45, 90%, 50%);">✶</span></span>
        <span class="version-date">10/26</span>
      </div>
      <div class="version" data-href="index-001.html">
        <span class="version-name">v1</span>
        <span class="version-desc">Initial concept (popover)</span>
        <span class="version-date">10/26</span>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.version[data-href]').forEach(row => {
      row.addEventListener('click', () => { window.location.href = row.dataset.href; });
    });
  </script>
</body>

</html>
