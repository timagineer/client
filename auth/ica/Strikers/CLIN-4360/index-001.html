<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype: Telehealth Waiting Room — Patient [CLIN-4360]</title>
  <style>
    :root {
      --brand:       hsl(218, 60%, 45%);
      --brand-deep:  hsl(218, 60%, 36%);
      --brand-soft:  hsl(218, 70%, 96%);
      --good:        hsl(140, 55%, 30%);
      --good-soft:   hsl(140, 55%, 94%);
      --warn:        hsl(34, 72%, 42%);
      --warn-soft:   hsl(34, 80%, 95%);
      --ink:         hsl(218, 22%, 18%);
      --ink-sub:     hsl(218, 14%, 42%);
      --ink-mute:    hsl(218, 10%, 58%);
      --border:      hsl(218, 18%, 88%);
      --bg:          hsl(218, 30%, 96%);
      --white:       #fff;
      --rad-card:    16px;
      --rad-btn:     8px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
    }

    /* ── Prototype picker bar ── */
    .proto-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .proto-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-mute);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .proto-bar button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--ink-sub);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      white-space: nowrap;
    }

    .proto-bar button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .proto-bar button:hover:not(.active) {
      background: var(--bg);
      border-color: var(--ink-mute);
    }

    /* ── Page ── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 80px 24px 40px;
      gap: 28px;
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--rad-card);
      padding: 48px 40px;
      text-align: center;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 16px rgba(30, 50, 90, 0.07), 0 1px 4px rgba(30, 50, 90, 0.04);
      opacity: 1;
      transform: scale(1);
      transition: opacity 150ms cubic-bezier(.39, .575, .565, 1),
                  transform 150ms cubic-bezier(.39, .575, .565, 1);
    }

    .card.out {
      opacity: 0;
      transform: scale(0.97) translateY(6px);
    }

    /* ── Status icon ── */
    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .status-icon svg {
      width: 28px;
      height: 28px;
    }

    .status-icon.brand   { background: var(--brand-soft); color: var(--brand); }
    .status-icon.success { background: var(--good-soft);  color: var(--good);  }
    .status-icon.warn    { background: var(--warn-soft);  color: var(--warn);  }

    /* ── Spinner ── */
    .spin { animation: spin 1.2s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Typography ── */
    .status-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 10px;
      line-height: 1.3;
    }

    .status-msg {
      font-size: 15px;
      color: var(--ink-sub);
      line-height: 1.65;
      margin: 0;
    }

    .status-note {
      font-size: 13px;
      color: var(--ink-mute);
      line-height: 1.5;
      margin: 16px 0 0;
    }

    /* ── Appointment time block ── */
    .appt-block {
      display: inline-block;
      margin: 20px 0 0;
      padding: 11px 20px;
      background: var(--bg);
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      color: var(--ink);
    }

    /* ── Session in progress badge ── */
    .session-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 20px 0 0;
      padding: 8px 16px;
      background: var(--good-soft);
      color: var(--good);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }

    .session-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
      animation: blink 1.6s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Waiting dots ── */
    .waiting-dots {
      display: inline-flex;
      gap: 5px;
      margin: 20px 0 0;
    }

    .waiting-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      opacity: 0.25;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }

    .waiting-dots span:nth-child(2) { animation-delay: 0.18s; }
    .waiting-dots span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes dot-pulse {
      0%, 100% { opacity: 0.2; }
      50%       { opacity: 1;   }
    }

    /* ── Warn dots (amber) ── */
    .waiting-dots.warn span { background: var(--warn); }

    /* ── Actions ── */
    .card-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .card-btn {
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--ink-sub);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: var(--rad-btn);
      cursor: pointer;
      font-family: inherit;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .card-btn:hover {
      background: var(--bg);
      border-color: var(--ink-mute);
    }

    .card-btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      font-weight: 600;
    }

    .card-btn.primary:hover {
      background: var(--brand-deep);
      border-color: var(--brand-deep);
    }

    /* ── Page footer ── */
    .page-footer {
      font-size: 12px;
      color: var(--ink-mute);
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .card             { transition: none; }
      .spin             { animation: none; }
      .waiting-dots span,
      .session-badge .dot { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="proto-bar">
    <span class="proto-label">Prototype</span>
    <button class="active" onclick="setState('pre-window', this)">Before window</button>
    <button onclick="setState('waiting', this)">Waiting</button>
    <button onclick="setState('late', this)">Running late</button>
    <button onclick="setState('admitted', this)">Admitted</button>
    <button onclick="setState('ended', this)">Ended</button>
  </div>

  <div class="page">
    <div class="card" id="card"></div>
    <p class="page-footer">Powered by ICANotes Plus</p>
  </div>

  <script>
    var provider = 'Sarah Rogers, LCSW';

    var icons = {
      'calendar-clock': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v3"/><path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"/><path d="M3 9h5.859"/><path d="M8 2v3"/><circle cx="16" cy="16" r="6"/></svg>',
      'hourglass':      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>',
      'video':          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
      'circle-check':   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>'
    };

    var states = {
      'pre-window': function() {
        return {
          icon: 'calendar-clock',
          iconClass: 'brand',
          title: 'Your session link isn\u2019t active yet',
          body:
            '<p class="status-msg">Your appointment with ' + provider + ' is today at 2:00\u202fPM. This link opens shortly before your session starts.</p>' +
            '<div class="appt-block">Today \u00b7 2:00 PM</div>'
        };
      },
      'waiting': function() {
        return {
          icon: 'hourglass',
          iconClass: 'brand',
          title: 'You\u2019re in the waiting room',
          body:
            '<p class="status-msg">' + provider + ' will bring you into the session when it\u2019s time. Keep this tab open.</p>' +
            '<div class="waiting-dots"><span></span><span></span><span></span></div>' +
            '<p class="status-note">This waiting room is private. No one else can see or hear you.</p>'
        };
      },
      'late': function() {
        return {
          icon: 'hourglass',
          iconClass: 'warn',
          title: provider + ' is running a few minutes behind',
          body:
            '<p class="status-msg">You\u2019re still checked in, and you don\u2019t need to do anything. Your session will start soon.</p>' +
            '<div class="waiting-dots warn"><span></span><span></span><span></span></div>'
        };
      },
      'admitted': function() {
        return {
          icon: 'video',
          iconClass: 'success',
          title: 'Your session is ready',
          body:
            '<p class="status-msg">' + provider + ' is ready for you. Click below to join.</p>' +
            '<div class="session-badge"><span class="dot"></span>Session in progress</div>' +
            '<div class="card-actions"><button class="card-btn primary" onclick="alert(\'Opens video session\')">Join session</button></div>'
        };
      },
      'ended': function() {
        return {
          icon: 'circle-check',
          iconClass: 'brand',
          title: 'Your session has ended',
          body:
            '<p class="status-msg">Take a moment for yourself before jumping back into your day.</p>' +
            '<div class="card-actions">' +
              '<button class="card-btn" onclick="alert(\'Opens messaging\')">Message your care team</button>' +
              '<button class="card-btn" onclick="alert(\'Opens appointments\')">View upcoming appointments</button>' +
            '</div>'
        };
      }
    };

    function renderState(key) {
      var fn = states[key];
      if (!fn) return;
      var s = fn();
      var card = document.getElementById('card');
      card.innerHTML =
        '<div class="status-icon ' + s.iconClass + '">' + (icons[s.icon] || '') + '</div>' +
        '<h2 class="status-title">' + s.title + '</h2>' +
        s.body;
    }

    function setState(key, btn) {
      document.querySelectorAll('.proto-bar button').forEach(function(b) {
        b.classList.remove('active');
      });
      if (btn) btn.classList.add('active');

      var card = document.getElementById('card');
      card.classList.add('out');
      setTimeout(function() {
        renderState(key);
        card.classList.remove('out');
      }, 150);
    }

    // Init
    renderState('pre-window');
  </script>

</body>
</html>
